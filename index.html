<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CGPA Calculator | BRACU</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- GitHub Header Link Bar -->
    <header id="git_link">
        <a href="https://github.com/niloyahsan1/cgpacheck.git" target="_blank" rel="noopener noreferrer"
            title="View Source on GitHub">
            <img src="./assets/github-logo.webp" id="github" alt="GitHub Logo">
        </a>
    </header>

    <main class="container">
        <div class="card">
            <h1>CGPA Calculator</h1>
            <p class="subtitle">Specially designed for BRACU Students</p>

            <form id="cgpaForm">
                <div class="form-group">
                    <label for="cdcom">Credit Completed:</label>
                    <input type="number" id="cdcom" name="cdcom" min="0" placeholder="e.g. 90" required>
                </div>

                <div class="form-group">
                    <label for="oldcgpa">Current CGPA:</label>
                    <input type="number" step="0.01" min="0" max="4.00" id="oldcgpa" name="oldcgpa"
                        placeholder="e.g. 3.50" required>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="hasCSE400" name="hasCSE400">
                    <label for="hasCSE400">Have you taken CSE400? (4 Credits)</label>
                </div>

                <div id="cse400GpaInput"></div>

                <div class="form-group">
                    <label for="courseCount">Number of Courses (3 Credits each):</label>
                    <select id="courseCount" name="courseCount" required>
                        <option value="0">0 Courses</option>
                        <option value="1">1 Course</option>
                        <option value="2">2 Courses</option>
                        <option value="3">3 Courses</option>
                        <option value="4">4 Courses</option>
                        <option value="5">5 Courses</option>
                    </select>
                </div>

                <div id="courseGpaInputs"></div>

                <button type="submit" id="calculateButton">Calculate CGPA</button>
            </form>

            <div class="result-container" id="resultBox" style="display: none;">
                <div class="result-card">
                    <span class="result-label">Calculated CGPA</span>
                    <h2 id="resultText">0.00</h2>
                    <button type="button" id="startOverButton">Start Over</button>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
